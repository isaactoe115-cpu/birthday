<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Nuna! 🎀</title>

    <!-- Google Fonts untuk font yang lucu & lembut -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Sacramento&display=swap" rel="stylesheet">
    <!-- Canvas Confetti Library untuk animasi bunga -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #ffeef2;
            font-family: 'Fredoka', cursive, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            color: #d8698b;
            text-align: center;
            overflow-x: hidden;
        }

        .container {
            background: #ffffff;
            padding: 30px 20px;
            border-radius: 25px;
            box-shadow: 0 10px 25px rgba(255, 182, 193, 0.4);
            max-width: 400px;
            width: 100%;
            border: 4px solid #ffccd5;
            position: relative;
        }

        h2 {
            font-size: 1.3rem;
            margin-bottom: 20px;
            color: #b5446e;
        }

        /* Styling Gambar Kado */
        .gift-box {
            font-size: 80px;
            cursor: pointer;
            transition: transform 0.3s ease;
            user-select: none;
            margin: 10px auto;
            display: inline-block;
            animation: bounce 2s infinite;
        }

        .gift-box:hover {
            transform: scale(1.15) rotate(5deg);
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-15px); }
            60% { transform: translateY(-7px); }
        }

        /* Pesan dari Kado */
        .birthday-text {
            font-family: 'Sacramento', cursive;
            font-size: 2.8rem;
            color: #ff4d6d;
            margin: 15px 0;
            display: none;
            animation: fadeIn 1s forwards;
            text-shadow: 1px 1px 2px #ffccd5;
        }

        /* Area Tombol-tombol */
        .button-group {
            margin-top: 25px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            background-color: #ffb3c1;
            color: #7209b7;
            border: none;
            padding: 12px 20px;
            border-radius: 20px;
            font-size: 1rem;
            font-weight: 600;
            font-family: 'Fredoka', sans-serif;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(255, 153, 172, 0.3);
            transition: all 0.2s ease;
        }

        .btn:hover {
            background-color: #ff8fa3;
            color: #fff;
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(1px);
        }

        /* Surat Kecil */
        .letter-card {
            background-color: #fff0f3;
            border: 2px dashed #ff758f;
            border-radius: 15px;
            padding: 20px;
            margin-top: 20px;
            display: none;
            animation: slideDown 0.8s ease forwards;
            text-align: left;
            position: relative;
        }

        .letter-card p {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #5c2035;
        }

        /* Animasi */
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>✨ Ada Hadiah Spesial! ✨</h2>
        <p style="font-size: 0.85rem; color: #d8698b;">Tekan kado di bawah ini ya:</p>
        
        <!-- Gambar / Emoji Kado -->
        <div class="gift-box" id="giftBox" onclick="openGift()">🎁</div>

        <!-- Tulisan yang keluar setelah kado ditekan -->
        <div class="birthday-text" id="birthdayText">Happy Birthday Nuna! 💖</div>

        <!-- Group Tombol Interaktif -->
        <div class="button-group">
            <button class="btn" onclick="showerFlowers()">🌸 Tabur Bunga 🌸</button>
            <button class="btn" onclick="openLetter()">✉️ Buka Surat Kecil</button>
        </div>

        <!-- Surat Kecil -->
        <div class="letter-card" id="letterCard">
            <p>
                happy birthday nuna, semoga dihari yang indah ini dan seterusnya nuna diberi kebahagiaan, rezeki yang lancar, dan kesehatannya terjaga. terimakasih nuna, aku beruntung bisa kenal nuna ✨🤍
            </p>
        </div>
    </div>

    <script>
        // Fungsi saat kado ditekan
        function openGift() {
            const gift = document.getElementById('giftBox');
            const text = document.getElementById('birthdayText');
            
            // Ubah ikon kado menjadi pita/love dan munculkan teks
            gift.innerHTML = '🎀';
            text.style.display = 'block';
        }

        // Fungsi saat tombol bunga ditekan (Memenuhi layar dengan animasi bunga)
        function showerFlowers() {
            const defaults = {
                spread: 360,
                ticks: 100,
                gravity: 0.5,
                decay: 0.94,
                startVelocity: 30,
                shapes: ['star'],
                colors: ['#ffb3c1', '#ff8fa3', '#ff758f', '#f72585', '#7209b7', '#ffffff']
            };

            // Meluncurkan bunga/partikel dari beberapa sudut layar
            confetti({
                ...defaults,
                particleCount: 80,
                scalar: 1.2,
                origin: { x: 0.2, y: 0.4 }
            });

            confetti({
                ...defaults,
                particleCount: 80,
                scalar: 1.2,
                origin: { x: 0.8, y: 0.4 }
            });

            confetti({
                ...defaults,
                particleCount: 100,
                scalar: 1.5,
                origin: { x: 0.5, y: 0.2 }
            });
        }

        // Fungsi saat tombol surat ditekan
        function openLetter() {
            const letter = document.getElementById('letterCard');
            if (letter.style.display === 'block') {
                letter.style.display = 'none';
            } else {
                letter.style.display = 'block';
            }
        }
    </script>
</body>
</html>
